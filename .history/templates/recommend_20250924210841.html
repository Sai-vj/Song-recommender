{% extends "base.html" %}

{% block title %}Recommend • Song Recommender{% endblock %}

{% block content %}
<div class="text-center">
    <h2 class="mb-4">Enter Your Mood 🎶</h2>
    <form method="POST" class="d-flex justify-content-center">
        <input type="text" name="mood" 
               class="form-control w-50 shadow-sm" 
               placeholder="happy, sad, chill, workout..." required>
        <button type="submit" class="btn btn-light ms-2 shadow">Get Playlists</button>
    </form>
    <br>
    <a href="{{ url_for('history') }}" class="text-light">📜 View History</a>
</div>
{% endblock %}
